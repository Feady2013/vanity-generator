# ===== config.yaml 示例（复制到可执行文件同目录使用）=====
#
# 难度速查（期望尝试次数 ≈ 16^（前缀+后缀位数），大小写敏感再乘 2^字母数）：
#   2 位前缀 ≈ 256 次（秒级） | 4 位 ≈ 6.5 万（分钟级）
#   5 位 ≈ 100 万（小时级）  | 6 位 ≈ 1670 万（天级）
# 本示例的 front+back 组合期望约 43 亿次，仅供展示字段，实际搜索请自行调整。
# 可先运行 `vanity-generator --check` 预估难度。

# 助记词长度（词数），只允许 12 / 18 / 24，其他值会报错
word_count: 24

# 靓号规则：front / middle / back 至少定义一个，否则启动时报错
# front: 去掉 0x 后必须以该前缀开头（带 0x 也可写作 "0x8888"，解析时归一化）
# middle: 去掉 0x 后地址中任意位置包含该子串
# back: 去掉 0x 后必须以该后缀结尾
# 多字段同时定义时必须同时满足；取值只能包含 [0-9a-fA-F]
front: "8888"
# middle: "8888"
back: "8888"

# 是否大小写敏感（可选，默认 false）
# true 时匹配目标是地址的 EIP-55 校验和形式：
#   例如 front: "AaAaAa" 只命中校验和形式 0xAaAaAa…，0xaaaaaa… 不命中。
#   注意：字母越多越难命中（每位字母额外引入约 1/2 的约束）。
case_sensitive: false

# 进度通知（可选）：每尝试 N 次输出一行总数与速率；填 false 禁用
progress_every: 100000

# BIP32 派生路径，不填默认 m/44'/60'/0'/0/0
# 允许任意合法路径，如 m/44'/60'/0'/0/217
path: "m/44'/60'/0'/0/0"

# 需要找到多少个符合条件的地址（1..=1000）
# 每找到一个立即 GPG 加密落盘，然后继续找下一个
count: 5

# GPG 公钥来源优先级：本字段（gpg_key_file）优先；仅当未填写本字段时，
# 才回退使用环境变量 VANITY_GPG_KEY（公钥 armor 内容）。已填写本字段但文件
# 读不到会直接报错，不会静默回退环境变量（防止环境变量被注入攻击者公钥）。
gpg_key_file: "fx1024.asc"
