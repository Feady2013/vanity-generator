name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要（重新）发布的 tag（必须已存在且指向目标 commit）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  snapshot:
    name: 既有 Release 快照（重推 tag 防丢失审计）
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: 解析目标 tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次发布目标 tag：$TAG"
      - name: 快照既有 Release 元数据到 Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # GitHub 平台行为：删除/强推已有 Release 的 tag 会连带删除该
          # Release（发生在本工作流启动前，无法阻止）。此步把既有
          # Release 的 notes/assets 清单快照进 Summary，保证即使被平台
          # 删除也可追溯，随后 create/upload 幂等重建。
          if gh release view "$TAG" > /tmp/rel.json 2>/dev/null; then
            {
              echo "## 既有 Release 快照（$TAG）"
              echo '```'
              gh release view "$TAG" --json body,assets,createdAt \
                --jq '{createdAt, body, assets: [.assets[].name]}' 2>/dev/null || cat /tmp/rel.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release $TAG 不存在（新建，或已被 tag 重推连带删除——见仓库 Events 审计）" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: 构建 (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 工具链（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 安装 aarch64 交叉链接器（aarch64-musl）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # 幂等追加：vendor 提交的 .cargo/config.toml 已含该段，
          # 无条件重复追加会造成 TOML 重复键解析失败（fork 上实测踩坑）
          if ! grep -q 'aarch64-unknown-linux-musl' .cargo/config.toml 2>/dev/null; then
            printf '\n[target.aarch64-unknown-linux-musl]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
          fi


      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包（Unix）
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ needs.snapshot.outputs.tag }}
        run: |
          DIR="vanity-generator-${TAG}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/vanity-generator" "$DIR/"
          cp config.example.yaml README.md "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"

      - name: 打包（Windows）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "vanity-generator-${{ needs.snapshot.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vanity-generator.exe" $dir
          Copy-Item config.example.yaml $dir
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: 上传到 Release（幂等：不删既有，只补/覆盖同名资产）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.snapshot.outputs.tag }}
        run: |
          # 幂等发布：create 失败（已存在）不视为错误；--clobber 仅覆盖
          # 同名资产，绝不删除其他 Release 或其他资产。
          gh release create "$TAG" --title "$TAG" \
            --notes "以太坊靓号地址生成器 $TAG（多平台预编译二进制，详见 README）" --verify-tag || true
          gh release upload "$TAG" vanity-generator-*.${{ matrix.archive }} --clobber
          # 兜底：确保最终为已发布状态（tag 重推后可能残留 draft）
          gh release edit "$TAG" --draft=false || true
