name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 musl 工具链（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 安装 aarch64 交叉链接器（aarch64-musl）
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          # 幂等追加：vendor 提交的 .cargo/config.toml 已含该段，
          # 无条件重复追加会造成 TOML 重复键解析失败（fork 上实测踩坑）
          if ! grep -q 'aarch64-unknown-linux-musl' .cargo/config.toml 2>/dev/null; then
            printf '\n[target.aarch64-unknown-linux-musl]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml
          fi


      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包（Unix）
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          DIR="vanity-generator-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/vanity-generator" "$DIR/"
          cp config.example.yaml README.md "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"

      - name: 打包（Windows）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "vanity-generator-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vanity-generator.exe" $dir
          Copy-Item config.example.yaml $dir
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: 上传到 Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "以太坊靓号地址生成器 $GITHUB_REF_NAME（多平台预编译二进制，详见 README）" || true
          gh release upload "$GITHUB_REF_NAME" vanity-generator-*.${{ matrix.archive }} --clobber
