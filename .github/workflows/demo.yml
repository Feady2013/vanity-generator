name: 靓号演示（多机并行·共同目标）

# 手动触发的多机并行演示（v6，2026-10-11）：
#
# - 一个运行一个 tag：TAG = demo-run-{运行编号}，仅在整理发布阶段、
#   且确有命中产物时才创建 tag 与 Release（未产出则零残留）
# - 共同目标：以 commit status（demo-run-N/hit/m{i}/{j}）为全局命中
#   计数器，每机命中即刻上报，全部机器轮询，达标即停止本机
# - 全力并行：机器启动即开搜（无错峰），在途超额命中保留
# - API 防挂起：轮询的 gh api 均带 timeout，杜绝网络挂起卡死循环
# - 隔离保证：只创建/操作 demo-run-* 前缀的 tag 与 Release，
#   绝不触碰版本 tag（v*）、v0.x Release 或任何既有发布
# - 历史清理：cleanup-demo-releases.yml 一键保留最近 N 场
on:
  workflow_dispatch:
    inputs:
      machines:
        description: 并行机器数（1-20）
        required: false
        default: "8"
      timeout_minutes:
        description: 每台机器的搜索时限（分钟）
        required: false
        default: "15"

permissions:
  contents: write
  statuses: write

concurrency:
  group: demo-run
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: 初始化（配置·编译·矩阵）
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.cfg.outputs.count }}
      matrix: ${{ steps.gen.outputs.matrix }}
      machines: ${{ steps.gen.outputs.machines }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: 检查 Secrets 是否已配置
        env:
          CFG: ${{ secrets.config }}
          GPG: ${{ secrets.gpg }}
        run: |
          if [ -z "$CFG" ]; then
            echo "::error::仓库 Secrets 缺少 config（config.yaml 内容）。请到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi
          if [ -z "$GPG" ]; then
            echo "::error::仓库 Secrets 缺少 gpg（GPG 公钥 armor 内容）。请到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi

      - name: 解析目标数量
        id: cfg
        env:
          CFG: ${{ secrets.config }}
        run: |
          printf '%s\n' "$CFG" > config.yaml
          COUNT=$(ruby -ryaml -e 'c = YAML.load_file("config.yaml"); puts c["count"].to_i' 2>/dev/null || true)
          if ! [ "$COUNT" -ge 1 ] 2>/dev/null; then
            COUNT=$(grep -E '^count:' config.yaml | head -1 | awk '{print $2}' | tr -d '"' || true)
          fi
          if ! [ "$COUNT" -ge 1 ] 2>/dev/null; then COUNT=1; fi
          echo "目标数量：$COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译（release，vendor 离线）
        run: cargo build --release --offline 2>&1 | tail -2

      - name: 上传二进制工件（matrix 免编译）
        uses: actions/upload-artifact@v4
        with:
          name: vanity-binary
          path: target/release/vanity-generator
          retention-days: 1

      - name: 本场标识（tag 计划：有产出才在发布阶段创建）
        id: meta
        run: |
          TAG="demo-run-${GITHUB_RUN_NUMBER}"
          SHA="$(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "本场标识：$TAG → $SHA（tag 将在整理发布阶段、且确有命中时才创建）"

      - name: 生成矩阵
        id: gen
        run: |
          N=${{ inputs.machines || '8' }}
          if ! [ "$N" -ge 1 ] 2>/dev/null; then N=1; fi
          if [ "$N" -gt 20 ]; then N=20; fi
          MATRIX=$(seq 1 "$N" | sed 's/^/"/;s/$/"/' | paste -sd, - | sed 's/^/[/;s/$/]/')
          echo "矩阵：$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "machines=$N" >> "$GITHUB_OUTPUT"

  search:
    name: 搜索 (${{ matrix.machine }}/${{ needs.setup.outputs.machines }})
    needs: setup
    runs-on: ubuntu-latest
    # 任务级硬超时（分钟）：搜索时限 ≤20 + 下载/上报余量
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 下载预编译二进制
        uses: actions/download-artifact@v4
        with:
          name: vanity-binary

      - name: 搜索（共同目标：达标即停）
        shell: bash
        env:
          VANITY_CONFIG: ${{ secrets.config }}
          VANITY_GPG_KEY: ${{ secrets.gpg }}
          TARGET: ${{ needs.setup.outputs.count }}
          MACHINE: ${{ matrix.machine }}
          RUN_TAG: ${{ needs.setup.outputs.tag }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -u
          chmod +x ./vanity-generator
          M="$MACHINE"
          TARGET="$TARGET"
          TM=${{ inputs.timeout_minutes || '15' }}
          N=${{ needs.setup.outputs.machines }}
          CTX_BASE="$RUN_TAG/hit"
          echo "机器 $M/$N：共同目标 $TARGET 个地址，时限 ${TM} 分钟，全力并行"
          mkdir -p /tmp/out

          # ── 全局命中计数器：commit status（原子创建，无跨机写竞态）──
          hits_global() {
            timeout 15 gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" \
              --jq "[.[] | select(.context | startswith(\"$CTX_BASE\"))] | length" 2>/dev/null || echo -1
          }

          # 上报一个命中（先存文件、后报计数：顺序保证计数 ≤ 实际产物）
          report_hit() {
            local f="$1" i="$2"
            mkdir -p hits
            cp "$f" "hits/m${M}-$(basename "$f")"
            timeout 15 gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=success -f context="$CTX_BASE/m${M}/$i" \
              -f description="机器 $M 第 $i 个命中" > /dev/null 2>&1 || true
            echo "已上报命中：m${M}-$(basename "$f")（全局计数 $(( $(hits_global) ))/$TARGET）"
          }

          start=$SECONDS
          HARD=$(( TM * 60 + 30 ))   # 循环硬超时保险（时限 + 30s 收尾余量）

          # 达标即可直接跳过搜索（晚到机器快速通道）
          G0=$(hits_global)
          echo "[启动] 全局计数 $G0/$TARGET，本机时限 ${TM} 分钟（硬超时 ${HARD}s）"
          if [ "$G0" -ge "$TARGET" ]; then
            echo "共同目标已由先启机器完成，本机无需搜索"
            exit 0
          fi

          # 扫描新命中 → 上报（本机序号自增，context 唯一）
          scanned=""
          mine=0
          scan_new_hits() {
            for f in vanity_*.asc; do
              [ -f "$f" ] || continue
              case " $scanned " in *" $f "*) continue ;; esac
              mine=$((mine+1))
              report_hit "$f" "$mine" && scanned="$scanned $f" || mine=$((mine-1))
            done
          }

          ./vanity-generator > run.log 2>&1 &
          BIN=$!
          killed=0
          prev_line=""
          # 循环双保险退出：进程退出 / 达标 / 时限 / 硬超时
          while kill -0 "$BIN" 2>/dev/null \
                && [ $(( SECONDS - start )) -lt "$HARD" ]; do
            scan_new_hits
            # 进度行实时透传（仅变化时打印）
            last_line=$(tail -n 1 run.log 2>/dev/null || true)
            if [ -n "$last_line" ] && [ "$last_line" != "$prev_line" ]; then
              echo "[进度] $last_line"
              prev_line="$last_line"
            fi
            G=$(hits_global)
            # 每轮心跳：可观测性保证（无命中/无进度时也能看到活着）
            echo "[心跳] ${SECONDS}s（本机已运行 $(( SECONDS - start ))s）全局 $G/$TARGET"
            if [ "$G" -ge "$TARGET" ]; then
              echo "共同目标达成（全局 $G/$TARGET），本机提前停止"
              killed=1; kill "$BIN" 2>/dev/null || true; break
            fi
            if [ $(( SECONDS - start )) -ge $(( TM * 60 )) ]; then
              echo "达到本机时限 ${TM} 分钟，停止（已命中部分仍保留）"
              killed=1; kill "$BIN" 2>/dev/null || true; break
            fi
            # 轮询间隔：前 60 秒 3s 决胜；之后 8s，机器数 >10 时 12s（API 配额友好）
            SLEEP=3
            [ $(( SECONDS - start )) -ge 60 ] && SLEEP=8
            [ "$N" -gt 10 ] && [ $(( SECONDS - start )) -ge 60 ] && SLEEP=12
            sleep "$SLEEP"
          done
          [ $(( SECONDS - start )) -ge "$HARD" ] && echo "::warning::触发硬超时保险退出"
          # GitHub 的 bash 默认 -e：被 kill 的进程 wait 返回 143，需 || 捕获
          RC=0
          wait "$BIN" 2>/dev/null || RC=$?
          if [ "$killed" = 0 ] && [ "$RC" != 0 ]; then
            echo "::error::vanity-generator 异常退出（退出码 $RC），日志尾部："
            tail -n 15 run.log
            exit 1
          fi
          scan_new_hits || true
          cp run.log "log-machine-${M}.log"
          echo "本机命中：$mine 个（文件见 hits/）"
          echo "===== 本机完整运行日志 ====="
          cat run.log

      - name: 上传命中密文（若有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hits-${{ matrix.machine }}
          path: hits/
          if-no-files-found: ignore
          retention-days: 3

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.machine }}
          path: log-machine-*.log
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: 整理发布（有产出才创建 tag 与 Release）
    needs: [setup, search]
    if: always()
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # gh --verify-tag 需要 git 上下文
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 1

      - name: 下载全部机器产物
        uses: actions/download-artifact@v4
        with:
          path: arts
          pattern: "{hits,log}-*"
          merge-multiple: true

      - name: 归置产物（密文 / 日志分目录）
        run: |
          set -u
          mkdir -p cipher logs
          # 机器资产命名：m{机器号}-vanity_*.asc（密文）、log-machine-*.log（日志）
          find arts -name 'm*-vanity_*.asc' -exec mv {} cipher/ \; 2>/dev/null || true
          find arts -name 'log-machine-*.log' -exec mv {} logs/ \; 2>/dev/null || true
          echo "密文：$(find cipher -name '*.asc' | wc -l) 个；日志：$(find logs -name '*.log' | wc -l) 份"

      - name: 打印全部 GPG 加密密文（每个密文完整输出一次）
        run: |
          set -u
          total=$(find cipher -name '*.asc' 2>/dev/null | wc -l)
          if [ "$total" -eq 0 ]; then
            echo "::notice::本场无 .asc 加密产物，跳过打印。"
            exit 0
          fi
          echo "共 $total 个加密产物，开始逐个完整打印："
          i=0
          for f in cipher/*.asc; do
            [ -f "$f" ] || continue
            i=$((i+1))
            printf '\n'
            echo "===================== 密文 $i / $total ====================="
            echo "文件：$(basename "$f")"
            echo "---------------------------------------------------------------------"
            cat "$f"
            printf '\n'
            echo "---------------------------------------------------------------------"
          done
          printf '\n'
          echo "共打印 $i 个加密密文；以上 ASCII Armor 密文仅持对应 GPG 私钥者可解密。"

      - name: 汇总与整理（未产出则不创建 tag）
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -u
          TARGET=${{ needs.setup.outputs.count }}
          HITS=$(find cipher -name '*.asc' 2>/dev/null | wc -l)
          echo "本场命中：$HITS / 目标 $TARGET"
          if [ "$HITS" -eq 0 ]; then
            echo "::notice::本场未命中任何地址——按约定不创建 tag 与 Release（零残留，不影响任何既有发布）。"
            exit 0
          fi

          # 难度提示（任一机器日志）
          EXPECT=$(grep -h "期望尝试" logs/log-machine-*.log 2>/dev/null | head -1 || true)
          echo "规则难度：${EXPECT:-（见各机器日志）}"
          STATUS="已完成共同目标"
          [ "$HITS" -lt "$TARGET" ] && STATUS="未在时限内完成共同目标（$HITS/$TARGET）"

          # ── 整理发布阶段：此刻才创建 tag（唯一建 tag 点）──
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" > /dev/null 2>&1; then
            echo "tag $TAG 已存在（异常：同运行号重复？跳过建 tag）"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA"
            echo "已创建 tag $TAG → $SHA"
          fi

          {
            echo "## 靓号演示（多机并行·共同目标）· 第 ${GITHUB_RUN_NUMBER} 次运行"
            echo ""
            echo "- 并行机器：${{ inputs.machines || '8' }} 台（启动即全力并行）"
            echo "- 共同目标：$TARGET 个地址（全部机器达标即停）"
            echo "- 状态：$STATUS"
            echo "- ${EXPECT}"
            echo "- 加密产物仅持对应 GPG 私钥者可解密；各机器运行日志见附件 log-machine-*.log"
            echo "- 本 Release 为预发布（prerelease），对应 tag \`$TAG\`（每场一个 tag，历史可用 cleanup-demo-releases 一键清理）"
          } > notes.md
          cat notes.md

          # ── 创建 Release 并上传产物（--clobber 仅覆盖同名，绝不删除）──
          gh release create "$TAG" --title "靓号演示（多机并行·共同目标）· 第 ${GITHUB_RUN_NUMBER} 次运行" \
            --notes-file notes.md --prerelease --verify-tag || true
          # 上传密文与日志（密文已在上面完整打印过，附件供下载）
          find cipher -name '*.asc' -exec gh release upload "$TAG" {} --clobber \; || true
          find logs -name '*.log' -exec gh release upload "$TAG" {} --clobber \; || true
          gh release edit "$TAG" --draft=false --prerelease || true

          {
            echo "## 发布完成：$TAG"
            echo ""
            echo "- commit：\`$SHA\`"
            echo "- 命中：$HITS / 目标 $TARGET（$STATUS）"
            echo "- 本场只创建 demo-run-* tag，未触碰任何版本 tag 与 Release"
          } >> "$GITHUB_STEP_SUMMARY"
