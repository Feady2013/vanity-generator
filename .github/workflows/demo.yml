name: 靓号演示（多机并行·共同目标）

# 手动触发的多机并行演示（v5）：
#
# - 编译前移：setup 任务统一编译并上传二进制工件，matrix 机器直接下载
#   运行（省去每台 3-5 分钟的重复编译）
# - 共同目标：以 demo-latest Release 资产为全局命中计数器，每机命中即刻
#   上报，全部机器轮询全局命中数，达标即停止本机
# - 全力并行：机器启动即开搜（无错峰），在途超额命中保留（检测延迟
#   内的自然超产，通常 ≤ 机器数）
# - API 防挂起：轮询的 gh api 均带 timeout 15s，杜绝网络挂起卡死循环
# - 零命中不发布：未命中任何地址时删除演示 Release（不发布空产物）
# - 发布形态：固定 prerelease 标签 demo-latest（不占 Latest、不堆积标签）
on:
  workflow_dispatch:
    inputs:
      machines:
        description: 并行机器数（1-20）
        required: false
        default: "8"
      timeout_minutes:
        description: 每台机器的搜索时限（分钟）
        required: false
        default: "15"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: 初始化（配置·编译·矩阵）
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.cfg.outputs.count }}
      matrix: ${{ steps.gen.outputs.matrix }}
      machines: ${{ steps.gen.outputs.machines }}
    steps:
      - name: 检查 Secrets 是否已配置
        env:
          CFG: ${{ secrets.config }}
          GPG: ${{ secrets.gpg }}
        run: |
          if [ -z "$CFG" ]; then
            echo "::error::仓库 Secrets 缺少 config（config.yaml 内容）。请到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi
          if [ -z "$GPG" ]; then
            echo "::error::仓库 Secrets 缺少 gpg（GPG 公钥 armor 内容）。请到 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi

      - name: 解析目标数量
        id: cfg
        env:
          CFG: ${{ secrets.config }}
        run: |
          printf '%s\n' "$CFG" > config.yaml
          COUNT=$(ruby -ryaml -e 'c = YAML.load_file("config.yaml"); puts c["count"].to_i' 2>/dev/null || true)
          if ! [ "$COUNT" -ge 1 ] 2>/dev/null; then
            COUNT=$(grep -E '^count:' config.yaml | head -1 | awk '{print $2}' | tr -d '"' || true)
          fi
          if ! [ "$COUNT" -ge 1 ] 2>/dev/null; then COUNT=1; fi
          echo "目标数量：$COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译（release，vendor 离线）
        run: cargo build --release --offline 2>&1 | tail -2

      - name: 上传二进制工件（matrix 免编译）
        uses: actions/upload-artifact@v4
        with:
          name: vanity-binary
          path: target/release/vanity-generator
          retention-days: 1

      - name: 生成矩阵并初始化演示 Release
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          N=${{ inputs.machines || '8' }}
          if ! [ "$N" -ge 1 ] 2>/dev/null; then N=1; fi
          if [ "$N" -gt 20 ]; then N=20; fi
          MATRIX=$(seq 1 "$N" | sed 's/^/"/;s/$/"/' | paste -sd, - | sed 's/^/[/;s/$/]/')
          echo "矩阵：$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "machines=$N" >> "$GITHUB_OUTPUT"
          # 全力并行：机器启动即开搜（无错峰延迟）
          # 固定单一 prerelease 标签 demo-latest：不存在则创建，存在则清空旧资产（全局计数归零）
          if ! gh release view demo-latest > /dev/null 2>&1; then
            gh release create demo-latest --prerelease --title "靓号演示（多机并行）" --notes "初始化（自动创建）" || true
          fi
          for AID in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/demo-latest" --jq '.assets[].id' 2>/dev/null); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID" || true
          done

  search:
    name: 搜索 (${{ matrix.machine }}/${{ needs.setup.outputs.machines }})
    needs: setup
    runs-on: ubuntu-latest
    # 任务级硬超时（分钟）：搜索时限 ≤20 + 下载/上报余量（GitHub 表达式
    # 不支持算术，取保守上界；循环内的精确时限以 TM 为准）
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 下载预编译二进制
        uses: actions/download-artifact@v4
        with:
          name: vanity-binary

      - name: 搜索（共同目标：达标即停）
        shell: bash
        env:
          VANITY_CONFIG: ${{ secrets.config }}
          VANITY_GPG_KEY: ${{ secrets.gpg }}
          TARGET: ${{ needs.setup.outputs.count }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -u
          chmod +x ./vanity-generator
          M="$MACHINE"
          TARGET="$TARGET"
          TM=${{ inputs.timeout_minutes || '15' }}
          N=${{ needs.setup.outputs.machines }}
          echo "机器 $M/$N：共同目标 $TARGET 个地址，时限 ${TM} 分钟，全力并行"
          mkdir -p /tmp/out

          hits_on_release() {
            timeout 15 gh api "repos/$GITHUB_REPOSITORY/releases/tags/demo-latest" \
              --jq '[.assets[].name | select(test("^m[0-9]+-vanity_"))] | length' 2>/dev/null || echo -1
          }

          # 时限计时（下载完成即开始）
          start=$SECONDS

          # 达标即可直接跳过搜索（晚到机器快速通道）
          if [ "$(hits_on_release)" -ge "$TARGET" ]; then
            echo "共同目标已由先启机器完成，本机无需搜索"
            exit 0
          fi

          upload_new_hits() {
            for f in vanity_*.asc; do
              [ -f "$f" ] || continue
              case " $uploaded " in *" $f "*) continue ;; esac
              staged="/tmp/out/m${M}-$(basename "$f")"
              if cp "$f" "$staged" && timeout 30 gh release upload demo-latest "$staged" --clobber; then
                uploaded="$uploaded $f"
                echo "已上报命中：m${M}-$(basename "$f")"
              fi
            done
          }

          ./vanity-generator > run.log 2>&1 &
          BIN=$!
          uploaded=""
          killed=0
          prev_line=""
          while kill -0 "$BIN" 2>/dev/null; do
            upload_new_hits
            # 进度行实时透传（仅变化时打印）
            last_line=$(tail -n 1 run.log 2>/dev/null || true)
            if [ -n "$last_line" ] && [ "$last_line" != "$prev_line" ]; then
              echo "[进度] $last_line"
              prev_line="$last_line"
            fi
            G=$(hits_on_release)
            if [ "$G" -ge "$TARGET" ]; then
              echo "共同目标达成（全局 $G/$TARGET），本机提前停止"
              killed=1; kill "$BIN"; break
            fi
            if [ $(( SECONDS - start )) -ge $(( TM * 60 )) ]; then
              echo "达到本机时限 ${TM} 分钟，停止（已命中部分仍保留）"
              killed=1; kill "$BIN"; break
            fi
            # 轮询间隔：前 60 秒 3s 决胜；之后 8s，机器数 >10 时 12s（API 配额友好）
            SLEEP=3
            [ $(( SECONDS - start )) -ge 60 ] && SLEEP=8
            [ "$N" -gt 10 ] && [ $(( SECONDS - start )) -ge 60 ] && SLEEP=12
            sleep "$SLEEP"
          done
          # GitHub 的 bash 默认 -e：被 kill 的进程 wait 返回 143，需 || 捕获
          RC=0
          wait "$BIN" 2>/dev/null || RC=$?
          if [ "$killed" = 0 ] && [ "$RC" != 0 ]; then
            echo "::error::vanity-generator 异常退出（退出码 $RC），日志尾部："
            tail -n 15 run.log
            exit 1
          fi
          upload_new_hits || true
          cp run.log "/tmp/out/log-machine-${M}.log"
          timeout 30 gh release upload demo-latest "/tmp/out/log-machine-${M}.log" --clobber || true
          echo "===== 本机完整运行日志 ====="
          cat run.log

      - name: 构建产物检查（防路径遗漏）
        if: always()
        run: ls -la vanity_*.asc 2>/dev/null || echo "（本机无命中文件——可能被共同目标提前停止或未命中）"

  publish:
    name: 整理发布
    needs: [setup, search]
    if: always()
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 汇总与整理（零命中不发布）
        run: |
          TARGET=${{ needs.setup.outputs.count }}
          HITS=$(timeout 15 gh api "repos/$GITHUB_REPOSITORY/releases/tags/demo-latest" \
            --jq '[.assets[].name | select(test("^m[0-9]+-vanity_"))] | length' 2>/dev/null || echo -1)
          echo "共同目标：$TARGET；全局命中：$HITS"
          if [ "$HITS" -lt 1 ]; then
            echo "::notice::本次运行未命中任何地址——按约定不发布 Release（删除演示 Release 及全部临时资产）。"
            timeout 30 gh release delete demo-latest --yes || true
            exit 0
          fi
          # 下载 1 号机日志提取难度提示（如有）
          EXPECT=""
          if timeout 30 gh release download demo-latest --pattern 'log-machine-*.log' --dir logs 2>/dev/null; then
            EXPECT=$(grep -h "期望尝试" logs/log-machine-*.log 2>/dev/null | head -1 || true)
          fi
          echo "规则难度：${EXPECT:-（见各机器日志）}"
          STATUS="已完成共同目标"
          [ "$HITS" -lt "$TARGET" ] && STATUS="未在时限内完成共同目标（$HITS/$TARGET）"
          {
            echo "## 靓号演示（多机并行·共同目标）· 第 ${GITHUB_RUN_NUMBER} 次运行"
            echo ""
            echo "- 并行机器：${{ inputs.machines || '8' }} 台（启动即全力并行）"
            echo "- 共同目标：$TARGET 个地址（全部机器达标即停）"
            echo "- 状态：$STATUS"
            echo "- ${EXPECT}"
            echo "- 加密产物仅持对应 GPG 私钥者可解密；各机器运行日志见附件 log-machine-*.log"
            echo "- 本 Release 为预发布（prerelease），固定复用 demo-latest 标签，不占用 Latest"
          } > notes.md
          cat notes.md
          timeout 30 gh release edit demo-latest \
            --title "靓号演示（多机并行·共同目标）· 第 ${GITHUB_RUN_NUMBER} 次运行" \
            --notes-file notes.md --prerelease
