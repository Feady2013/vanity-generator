name: 手动清理全部 Packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  cleanup:
    name: 手动清理全部 Packages
    runs-on: ubuntu-latest
    steps:
      - name: 删除全部 package（版本 + 包本体）
        uses: actions/github-script@v8
        with:
          # 个人账号的 Packages API（/user/packages）不接受 GITHUB_TOKEN，
          # 必须用带 read:packages + delete:packages scope 的 PAT。
          # 注意 input 名是 github-token（token 不生效 = 403 integration）。
          # 仓库 secret PACKAGE_TOKEN = 仓库所有者的 PAT（包归属随 token 所属账号走）。
          github-token: ${{ secrets.PACKAGE_TOKEN }}
          script: |
            const pkg = 'vanity-generator';

            const versions = await github.paginate('GET /user/packages/container/{package_name}/versions', {
              package_name: pkg,
              per_page: 100,
            });

            if (versions.length === 0) {
              core.notice('无 package 可清理。');
              return;
            }

            // 审计日志：记下将被清除的版本
            for (const v of versions) {
              const tags = (v.metadata?.container?.tags || []).join(', ') || '(无 tag)';
              core.info(`将删除版本 ${v.id}（tags: ${tags}，创建于 ${v.created_at}）`);
            }

            // 直接删除包本体（含全部版本）。
            // GitHub 规则：包的最后一个版本不可单独删（400 "You must delete the
            // package instead"），整包删除一条 API 搞定且无版本数限制；
            // 之后 docker push 同名镜像会自动重建包。
            await github.request('DELETE /user/packages/container/{package_name}', {
              package_name: pkg,
            });
            core.info(`已删除包本体 ${pkg}（含 ${versions.length} 个版本）。`);
